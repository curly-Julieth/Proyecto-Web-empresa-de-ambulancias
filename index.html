<!--
RESPONSIBILITY:
This file is the main entry point of the Ambulance
Management System.

ARCHITECTURE:
The application follows a Single Page Application (SPA)
approach. Instead of creating multiple HTML pages, all
modules are dynamically rendered inside the <main>
container using JavaScript modules.

MAIN COMPONENTS:
- Top navigation bar (header)
- Sidebar menu navigation
- Dynamic content container (#main)
- Toast notification system
- Logout confirmation modal

DYNAMIC RENDERING:
Each system module (Clients, Drivers, Vehicles,
Transfers, Payments and AI Chat) generates its own HTML
through JavaScript and injects it into the #main
container when selected from the sidebar menu.

DEPENDENCIES:
- app.js: Application initialization.
- menuPrincipal.js: Navigation and module loading.
- styles.css: Application styling.

VERSION:
Ambulance Management System v1.1
=========================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Configuración basica -->
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Ambulancias</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

    <!--
    This file does not contain the HTML structure of each module.
    The application uses dynamic rendering, so every view is
    generated through JavaScript and injected into the main
    container when needed.
    -->

    <!-- Main application container -->
    <div id="app" data-theme="dark">

      <!-- Top navigation bar -->
      <header id="topbar">
          <h1>Ambulancias Vida</h1>
          <p>Versión 1.1</p>
      </header>

      <!-- Sidebar mounting point -->
      <!-- Receives the navigation menu generated by menuPrincipal.js -->
      <div id="menuPrincipalMount"></div>

      <!-- Main dynamic content container -->
      <!-- All module views are rendered here -->
      <main id="main" tabindex="1" aria-label="Contenido principal"></main>

       <!-- Toast notification container -->
      <!-- Used to display temporary feedback messages -->
      <div id="toast" class="toast" hidden></div>

      <!-- Logout modal window -->
      <div id="logoutModal" class="modelOverlay" hidden>
        <div class="modalContenido">
            <h2>¿Cerrar sesión?</h2>
            <p>¿Estas seguro de que deseas salir?</p>
            <div class="modalActions">
                <button id="btnConfirm">Si, cerrar sesión</button>
                <button id="btnCancel">Cancelar</button>
            </div>
        </div>
      </div>
    </div>

     <!-- Application scripts -->
    <script src="./src/js/app.js" type="module"></script>
    <script src="./src/js/menuPrincipal.js" type="module"></script>
</body>
</html>
